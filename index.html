<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Frame | Photography & Videography</title>
    
    <!-- Google Fonts: Anton (Headers) & Space Mono (Metadata) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HERO SECTION: True Knockout Text Effect -->
    <header id="hero" class="poster-screen">
        <h1 class="knockout-text">DOUBLE<br>FRAME</h1>
    </header>

    <!-- DYNAMIC COLLABS CONTAINER -->
    <!-- app.js will inject the portfolio sections here automatically -->
    <div id="collabs-container"></div>

    <!-- CONTACT / FOOTER -->
    <footer id="contact" class="bg-charcoal poster-screen footer-layout">
        <h2 class="massive-text txt-chartreuse">LET'S<br>WORK</h2>
        <div class="contact-details metadata txt-white">
            <p>INFO@DOUBLEFRAME.COM</p>
            <p>INSTAGRAM: @DOUBLEFRAME</p>
            <br>
            <a href="mailto:info@doubleframe.com" class="btn">REACH OUT</a>
        </div>
    </footer>

    <!-- FULL SCREEN LIGHTBOX -->
    <div id="lightbox" class="lightbox-overlay hidden">
        <button class="lightbox-close massive-text txt-white">&times;</button>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Gallery Image">
        </div>
        <div class="lightbox-controls massive-text">
            <button id="lightbox-prev" class="txt-mint">&larr;</button>
            <button id="lightbox-next" class="txt-mint">&rarr;</button>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
