<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Frame | Photography & Videography</title>
    
    <!-- Google Fonts: Anton (Headers) & Space Mono (Metadata) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HERO SECTION: Knockout Text Effect -->
    <header id="hero" class="poster-screen">
        <!-- Text-free background image -->
        <div class="hero-bg" style="background-image: url('images/hero-bg.jpg');"></div>
        
        <div class="hero-knockout-wrapper">
            <h1 class="knockout-text">DOUBLE<br>FRAME</h1>
        </div>
    </header>

    <!-- FEATURED WORK: Lookbook spreads -->
    <section id="work" class="bg-red poster-screen">
        <div class="layout-grid">
            <div class="col-text">
                <h2 class="massive-text txt-charcoal sideways-text">COLLABS</h2>
            </div>
            <div class="col-media">
                <img src="images/project1.jpg" alt="Featured Work" class="project-img">
                <p class="metadata txt-white mt-1">01 // COMMERCIAL WORK — 2026</p>
            </div>
        </div>
    </section>

    <!-- CONTACT / FOOTER -->
    <footer id="contact" class="bg-charcoal poster-screen footer-layout">
        <h2 class="massive-text txt-chartreuse">LET'S<br>WORK</h2>
        <div class="contact-details metadata txt-white">
            <p>INFO@DOUBLEFRAME.COM</p>
            <p>INSTAGRAM: @DOUBLEFRAME</p>
            <br>
            <a href="mailto:info@doubleframe.com" class="btn">REACH OUT</a>
        </div>
    </footer>

</body>
</html>
